spring.application.name=inventario-service
spring.config.import=optional:configserver:http://localhost:8888
# El repositorio de configuraciones aún no tiene inventario-service.properties,
# por eso estas propiedades se definen localmente (mismos valores que los otros servicios)
server.port=7072
#Para Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# Zipkin
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0
# RabbitMQ Connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
# Logging correlation: application name + traceId + spanId
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false
# Logstash (ELK)
logging.logstash.destination=localhost:5000
