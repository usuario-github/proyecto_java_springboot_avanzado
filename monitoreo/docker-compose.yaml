services:
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkinj
    ports:
      - "9411:9411"
    networks:
      - monitoreo

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheusj
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoreo

  grafana:
    image: grafana/grafana:latest
    container_name: grafanaj
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - monitoreo

  # ===== Logging centralizado (ELK) =====
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearchj
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - monitoreo

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: logstashj
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      xpack.monitoring.enabled: "false"
    ports:
      - "5000:5000"   # Entrada TCP (JSON) desde los microservicios
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoreo

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: kibanaj
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoreo

networks:
  monitoreo:
    name: monitoreo
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
