# Recibe los logs JSON que envían los microservicios (LogstashTcpSocketAppender)
input {
  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  # Sin campo "app" el log no se pudo identificar: se marca para revisarlo
  if ![app] {
    mutate { add_field => { "app" => "desconocido" } }
  }
}

# Un índice por microservicio y por día: microservicios-pedido-service-2026.11.23
# (no se usa el prefijo "logs-" porque Elasticsearch 8 lo reserva para data streams)
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservicios-%{app}-%{+YYYY.MM.dd}"
  }
}
